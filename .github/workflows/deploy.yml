name: Deploy Checkout Service
'on':
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test
        run: npm install && npm test && npm run build
      - name: Validate environment-scoped lab credentials
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          test -n "$DEPLOY_KEY"
          test -n "$DATABASE_URL"
          test -n "$API_TOKEN"
          echo "Environment-scoped lab values available after approval (values not logged)"
      - name: Simulate production release
        run: echo "Training deployment approved; no external infrastructure changed"
